<div class="register-container fade-in">
    
    <div class="page-header center-header">
        <h1 class="welcome-text">Registrar Nuevo Paciente</h1>
        <p class="page-subtitle">Apertura de expediente clínico en NeuroMind AI.</p>
    </div>

    <div class="form-card centered-card">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-input" 
                           [class.error-border]="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched"
                           formControlName="nombre" placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Edad</label>
                        <input type="number" class="form-input" 
                               [class.error-border]="registerForm.get('edad')?.invalid && registerForm.get('edad')?.touched"
                               formControlName="edad" placeholder="Ej: 30">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sexo</label>  
                        <div class="custom-select-wrapper">
                            <select class="form-input" style="width: 100%;" 
                                    [class.error-border]="registerForm.get('sexo')?.invalid && registerForm.get('sexo')?.touched"
                                    formControlName="sexo">
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label class="form-label">Teléfono (Opcional)</label>
                    <input type="tel" class="form-input" 
                           [class.error-border]="registerForm.get('telefono')?.invalid && registerForm.get('telefono')?.touched"
                           formControlName="telefono" placeholder="+51 999 999 999">
                </div>
            </div>

            <div class="form-actions centered-actions">
                <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading()">
                    <i class="pi pi-save" style="margin-right: 8px;"></i> 
                    {{ isLoading() ? 'Guardando...' : 'Guardar Expediente' }}
                </button>
            </div>

        </form>
    </div>
</div>
